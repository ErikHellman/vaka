# Fly.io config for Vaka's ClickHouse (app "vaka-clickhouse").
# Private only: no public services; the server reaches it at vaka-clickhouse.internal:8123.
# Deploy: fly deploy -c deploy/fly/clickhouse/fly.toml
# Secret: CLICKHOUSE_PASSWORD (must match VAKA_CLICKHOUSE_PASSWORD on the vaka app).
app = "vaka-clickhouse"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  CLICKHOUSE_USER = "vaka"
  CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT = "1"

[mounts]
  source = "clickhouse_data"
  destination = "/var/lib/clickhouse"
  initial_size = "10gb"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
