# Turns an existing Vaka Fly.io app into a forwarder to a new host (deploy/hetzner/README.md):
#   fly deploy -a <app> -c deploy/fly/forward/fly.toml -e VAKA_FORWARD_TO=vaka.example.com
app = "my-vaka"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
