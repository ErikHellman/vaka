# Vaka: crash reporting and analytics for the agentic era.
#
#   cp .env.example .env   # set VAKA_ADMIN_EMAIL, VAKA_ADMIN_PASSWORD, VAKA_PUBLIC_URL
#   docker compose up -d
#
# Metadata is stored in SQLite by default. To use Postgres instead:
#   docker compose --profile postgres up -d
#   and set VAKA_DB_URL=postgres://vaka:vaka@postgres:5432/vaka in .env

services:
  vaka:
    image: ghcr.io/erikhellman/vaka:latest
    build: .
    restart: unless-stopped
    ports:
      - "${VAKA_PORT:-8080}:8080"
    env_file: .env
    environment:
      VAKA_CLICKHOUSE_URL: http://clickhouse:8123
      VAKA_CLICKHOUSE_USER: vaka
      VAKA_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-vaka}
    volumes:
      - vaka-data:/data
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: vaka
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-vaka}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaka
      POSTGRES_PASSWORD: vaka
      POSTGRES_DB: vaka
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  vaka-data:
  clickhouse-data:
  postgres-data:
