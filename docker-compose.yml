# Vaka: crash reporting and analytics for the agentic era.
#
#   cp .env.example .env   # set VAKA_PUBLIC_URL, VAKA_ADMIN_EMAIL, VAKA_ADMIN_PASSWORD
#   docker compose up -d
#
# Everything is configured in .env (see .env.example and docs/self-hosting.md):
#   - COMPOSE_PROFILES=caddy      adds Caddy with automatic HTTPS for VAKA_DOMAIN
#   - COMPOSE_PROFILES=postgres   adds Postgres for metadata (also set VAKA_DB_URL)
#   - VAKA_VERSION=0.3.0          pins the server image (default: latest)
#   - VAKA_PORT=127.0.0.1:8080    keeps the plain HTTP port off the network behind a proxy
#                                 (recommended with the caddy profile, so nobody bypasses HTTPS)

services:
  vaka:
    image: ${VAKA_IMAGE:-ghcr.io/erikhellman/vaka}:${VAKA_VERSION:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "${VAKA_PORT:-8080}:8080"
    env_file: .env
    environment:
      VAKA_CLICKHOUSE_URL: http://clickhouse:8123
      VAKA_CLICKHOUSE_USER: vaka
      VAKA_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env (a long random value)}
      # Only the bundled Caddy (fixed address below) may set X-Forwarded-For. Requests that reach
      # the published port directly are keyed by their own address.
      VAKA_TRUSTED_PROXIES: ${VAKA_TRUSTED_PROXIES:-127.0.0.1,::1,172.30.0.10}
    volumes:
      - vaka-data:/data
    networks:
      vaka:
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-24.8}
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: vaka
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env (a long random value)}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    networks:
      vaka:
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaka}
      POSTGRES_DB: vaka
    networks:
      vaka:
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vaka"]
      interval: 5s
      timeout: 3s
      retries: 30

  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      VAKA_DOMAIN: ${VAKA_DOMAIN:-localhost}
    volumes:
      - ./deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      vaka:
        ipv4_address: 172.30.0.10
    depends_on:
      - vaka

networks:
  vaka:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  vaka-data:
  clickhouse-data:
  postgres-data:
  caddy-data:
  caddy-config:
