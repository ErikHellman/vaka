name: Release Grafana plugin

# Builds, signs and publishes hellsoft-vaka-datasource as a GitHub release tagged grafana/vX.Y.Z.
# The zip is what you submit to the Grafana plugin catalog (grafana.com > My Plugins).
# Signing needs the repository secret GRAFANA_ACCESS_POLICY_TOKEN (scope plugins:write) from the
# hellsoft org on grafana.com. Without it the zip is unsigned (fine for local testing only).
# For a private signature, set GRAFANA_SIGN_ROOT_URLS (repository variable, comma-separated).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 0.1.0. Must match version in integrations/grafana/package.json."
        required: true

permissions:
  contents: write

defaults:
  run:
    working-directory: integrations/grafana

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
      ROOT_URLS: ${{ vars.GRAFANA_SIGN_ROOT_URLS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/grafana/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: integrations/grafana/go.mod
          cache-dependency-path: integrations/grafana/go.sum
      - name: Check version
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "bad version $VERSION"; exit 1; }
          [ "$(jq -r .version package.json)" = "$VERSION" ] || { echo "package.json version is not $VERSION"; exit 1; }
          grep -q "^## $VERSION" CHANGELOG.md || { echo "CHANGELOG.md has no '## $VERSION' section"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/grafana/v$VERSION" >/dev/null; then echo "tag exists"; exit 1; fi
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run test:ci
      - run: npm run build
      - run: go test ./pkg/...
      - uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          version: latest
          args: buildAll
          workdir: integrations/grafana
      - name: Sign
        run: |
          if [ -z "$GRAFANA_ACCESS_POLICY_TOKEN" ]; then
            echo "::warning::GRAFANA_ACCESS_POLICY_TOKEN is not set; the plugin is NOT signed"
          elif [ -n "$ROOT_URLS" ]; then
            npx --yes @grafana/sign-plugin@latest --rootUrls "$ROOT_URLS"
          else
            npx --yes @grafana/sign-plugin@latest
          fi
      - name: Package
        run: |
          ID=$(jq -r .id dist/plugin.json)
          ZIP="$ID-$VERSION.zip"
          cp -r dist "$ID" && zip -qr "$ZIP" "$ID" && rm -r "$ID"
          sha1sum "$ZIP" | cut -d' ' -f1 > "$ZIP.sha1"
          md5sum "$ZIP" | cut -d' ' -f1 > "$ZIP.md5"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Validate (the catalog review runs the same checks)
        continue-on-error: true
        run: docker run --pull=always -v "$PWD/$ZIP:/archive.zip" grafana/plugin-validator-cli -sourceCodeUri "https://github.com/${{ github.repository }}/tree/${{ github.sha }}/integrations/grafana" /archive.zip
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "grafana/v$VERSION" -m "Vaka Grafana plugin $VERSION"
          git push origin "refs/tags/grafana/v$VERSION"
          awk "/^## $VERSION/{f=1;next} /^## /{f=0} f" CHANGELOG.md > /tmp/notes.md
          gh release create "grafana/v$VERSION" "$ZIP" "$ZIP.sha1" "$ZIP.md5" \
            --title "Grafana plugin $VERSION" --notes-file /tmp/notes.md
          echo "Submit https://github.com/${{ github.repository }}/releases/download/grafana/v$VERSION/$ZIP to the Grafana catalog"
