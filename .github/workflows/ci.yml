name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The smoke tests deliver alerts to local mock servers on 127.0.0.1.
  VAKA_ALLOW_PRIVATE_ALERT_TARGETS: "true"
  # ...and run HTTP monitors against them. Canaries off: the result must not depend on the internet.
  VAKA_MONITOR_ALLOW_CIDRS: "127.0.0.0/8"
  VAKA_MONITOR_CANARY_URLS: "off"

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: vaka
          CLICKHOUSE_PASSWORD: vaka
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 30
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vaka
          POSTGRES_PASSWORD: vaka
          POSTGRES_DB: vaka
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaka" --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --features vaka-sdk/tracing
      - name: Unit tests
        run: cargo test --workspace
        env:
          VAKA_TEST_POSTGRES_URL: postgres://vaka:vaka@localhost:5432/vaka
      - name: Smoke test (SQLite, then cutover to Postgres)
        run: |
          mkdir -p /tmp/vaka-sqlite
          VAKA_DATA_DIR=/tmp/vaka-sqlite VAKA_LISTEN=127.0.0.1:8080 \
          VAKA_CLICKHOUSE_URL=http://localhost:8123 VAKA_CLICKHOUSE_USER=vaka VAKA_CLICKHOUSE_PASSWORD=vaka \
          VAKA_CLICKHOUSE_DATABASE=vaka_sqlite \
          VAKA_ADMIN_EMAIL=ci@example.com VAKA_ADMIN_PASSWORD=ci-smoke-Passw0rd VAKA_GITHUB_API_URL=http://127.0.0.1:18099/gh \
          VAKA_SMS_API_URL=http://127.0.0.1:18099/elks VAKA_46ELKS_USERNAME=u1 VAKA_46ELKS_PASSWORD=p1 \
            ./target/debug/vaka-server > /tmp/vaka-sqlite.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
          VAKA=http://127.0.0.1:8080 EMAIL=ci@example.com PASSWORD=ci-smoke-Passw0rd SMS_PATH=/elks/a1/sms bash scripts/smoke.sh
          PGPASSWORD=vaka psql -h localhost -U vaka -d vaka -c 'CREATE DATABASE vaka_cutover'
          VAKA=http://127.0.0.1:8080 EMAIL=ci@example.com PASSWORD=ci-smoke-Passw0rd \
          SQLITE_URL=sqlite:///tmp/vaka-sqlite/vaka.db PG_URL=postgres://vaka:vaka@localhost:5432/vaka_cutover \
          VAKA_CLICKHOUSE_URL=http://localhost:8123 VAKA_CLICKHOUSE_USER=vaka VAKA_CLICKHOUSE_PASSWORD=vaka \
          VAKA_CLICKHOUSE_DATABASE=vaka_sqlite VAKA_GITHUB_API_URL=http://127.0.0.1:18099/gh \
            bash scripts/cutover-smoke.sh
          kill $SERVER_PID
      - name: Smoke test (Postgres, debug files in S3)
        run: |
          mkdir -p /tmp/vaka-pg /tmp/s3data
          docker run -d --name s3 -p 9000:9000 -v /tmp/s3data:/data rclone/rclone:1.71 serve s3 --auth-key vakaak,vakasecret123 --addr :9000 /data
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9000/ && break; sleep 1; done
          VAKA_S3_BUCKET=vaka-ci VAKA_S3_ENDPOINT=http://127.0.0.1:9000 VAKA_S3_ACCESS_KEY_ID=vakaak VAKA_S3_SECRET_ACCESS_KEY=vakasecret123 \
          VAKA_DATA_DIR=/tmp/vaka-pg VAKA_LISTEN=127.0.0.1:8081 VAKA_DB_URL=postgres://vaka:vaka@localhost:5432/vaka \
          VAKA_CLICKHOUSE_URL=http://localhost:8123 VAKA_CLICKHOUSE_USER=vaka VAKA_CLICKHOUSE_PASSWORD=vaka \
          VAKA_CLICKHOUSE_DATABASE=vaka_pg \
          VAKA_ADMIN_EMAIL=ci@example.com VAKA_ADMIN_PASSWORD=ci-smoke-Passw0rd VAKA_GITHUB_API_URL=http://127.0.0.1:18099/gh \
          VAKA_SMS_PROVIDER=twilio VAKA_SMS_FROM=+15005550006 VAKA_SMS_API_URL=http://127.0.0.1:18099/twilio VAKA_TWILIO_ACCOUNT_SID=AC1 VAKA_TWILIO_AUTH_TOKEN=t1 \
            ./target/debug/vaka-server > /tmp/vaka-pg.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8081/health && break; sleep 1; done
          VAKA=http://127.0.0.1:8081 EMAIL=ci@example.com PASSWORD=ci-smoke-Passw0rd ARTIFACT_DIR=/tmp/vaka-pg/artifacts SMS_PATH=/twilio/2010-04-01/Accounts/AC1/Messages.json bash scripts/smoke.sh
          kill $SERVER_PID
      - name: Server logs
        if: failure()
        run: tail -n 200 /tmp/vaka-*.log

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Ignores, each with a reason, live in .cargo/audit.toml.
      - run: cargo audit

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  js-bundler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/js-bundler
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v7
      # setup-python has no 3.9 build for the current runner image; uv downloads one.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Core tests without optional dependencies
        run: |
          uv pip install -e . pytest
          pytest -q
      - name: All tests (OpenTelemetry, Django, Flask, FastAPI)
        run: |
          uv pip install -e ".[otel]" flask django fastapi httpx
          pytest -q
      - name: Build and check the package
        run: |
          uv build
          uvx twine check --strict dist/*

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: sdks/ios
    steps:
      - uses: actions/checkout@v7
      - name: Tests (macOS)
        run: swift test
      - name: Build for iOS, iOS Simulator, tvOS and Mac Catalyst
        run: |
          set -e
          for dest in "generic/platform=iOS" "generic/platform=iOS Simulator" "generic/platform=tvOS" "generic/platform=macOS,variant=Mac Catalyst"; do
            echo "::group::$dest"
            xcodebuild build -scheme Vaka -destination "$dest" -quiet CODE_SIGNING_ALLOWED=NO
            echo "::endgroup::"
          done
      - name: Build for app extensions (extension-safe API only)
        run: xcodebuild build -scheme Vaka -destination "generic/platform=iOS" -quiet CODE_SIGNING_ALLOWED=NO APPLICATION_EXTENSION_API_ONLY=YES

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew :vaka-android:testDebugUnitTest
      - name: Native crash handler (desktop build)
        run: vaka-android/src/test/cpp/run.sh
      - name: Minified sample build (mapping upload skipped without a token)
        run: ./gradlew :sample:assembleRelease
      - name: Gradle plugin
        run: ./gradlew -p vaka-gradle-plugin build

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  jvm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/jvm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew :vaka-jvm:test
      - name: Build sample and publication
        run: ./gradlew :sample:build :vaka-jvm:publishToMavenLocal

  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test -c Release
      - run: dotnet pack -c Release -o out
