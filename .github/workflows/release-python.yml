name: Release Python SDK

# Publishes sdks/python to PyPI as `vaka-sdk` with trusted publishing (no API token).
# See sdks/python/RELEASING.md for the one-time PyPI setup and the release steps.
on:
  push:
    tags: ["python-v*"]
  workflow_dispatch:
    inputs:
      repository:
        description: "Where to publish: pypi, testpypi, or none (build and test only)"
        required: true
        default: none
        type: choice
        options: [none, testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check version matches the tag
        if: github.event_name == 'push'
        run: |
          version=$(python -c 'import re;print(re.search(r"\"(.+)\"", open("src/vaka/_version.py").read()).group(1))')
          test "python-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Test
        run: |
          pip install -e ".[otel]" pytest flask django fastapi httpx
          pytest -q
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: sdks/python/dist/

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.repository != 'none'
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi') && 'testpypi' || 'pypi' }}
      url: ${{ (github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi') && 'https://test.pypi.org/p/vaka-sdk' || 'https://pypi.org/p/vaka-sdk' }}
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
