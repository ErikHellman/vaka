# Fly.io config for the Vaka server (app "vaka").
# ClickHouse runs as a separate private app, see deploy/fly/clickhouse/fly.toml.
# Deploy: fly deploy   (see docs/self-hosting.md#flyio)
app = "vaka"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  VAKA_PUBLIC_URL = "https://vaka.fly.dev"
  VAKA_DATA_DIR = "/data"
  VAKA_LISTEN = "0.0.0.0:8080"
  VAKA_CLICKHOUSE_URL = "http://vaka-clickhouse.internal:8123"
  VAKA_CLICKHOUSE_USER = "vaka"
  # Secrets: VAKA_CLICKHOUSE_PASSWORD, VAKA_ADMIN_EMAIL, VAKA_ADMIN_PASSWORD (fly secrets set ...)

[mounts]
  source = "vaka_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Ingest must always be reachable, so keep the single machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
