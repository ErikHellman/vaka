[package]
name = "vaka-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
base64 = "0.22"
bytes = "1.12.1"
flate2 = "1.1.11"
futures = "0.3.34"
hex = "0.4.3"
maud = { version = "0.27.0", features = ["axum"] }
maxminddb = "0.24"
once_cell = "1.21.4"
proguard = "5.10.5"
rand = "0.8"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sourcemap = "9.3.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "tls-rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "multipart"] }
symbolic = { version = "12", features = ["debuginfo", "symcache", "demangle"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "decompression-gzip", "compression-gzip", "fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
woothee = "0.13.0"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
